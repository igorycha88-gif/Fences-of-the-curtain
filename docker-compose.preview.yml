# Preview-стек: app из локально собранного образа (код запечён внутрь).
# Используется вместо docker-compose.dev.yml, когда путь проекта содержит кириллицу
# и Docker Desktop не может сделать bind mount `.:/app`.
# Сборка образа:
#   docker build -f docker/Dockerfile -t fences-app-preview:latest .
# Запуск:
#   docker compose -f docker-compose.preview.yml up -d

services:
  app:
    image: fences-app-preview:latest
    container_name: fences-app-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/fences
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - NEXTAUTH_URL=http://localhost:3001
      - SEO_TOR_ENABLED=true
      - SEO_TOR_SOCKS_HOST=tor
      - SEO_TOR_SOCKS_PORT=9050
      - SEO_TOR_CONTROL_PORT=9051
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor:
        condition: service_started
    networks:
      - fences-net

  db:
    image: postgres:16-alpine
    container_name: fences-db-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=fences
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - fences-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fences"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fences-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_dev_data:/data
    networks:
      - fences-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tor:
    image: captaingeech/tor-proxy:latest
    container_name: fences-tor-dev
    restart: unless-stopped
    networks:
      - fences-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s --socks5 127.0.0.1:9050 'https://check.torproject.org/' | grep -qm1 Congratulations || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 20s

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  fences-net:
    driver: bridge
