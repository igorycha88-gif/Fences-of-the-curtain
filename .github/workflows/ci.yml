name: CI

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Docker image tag (git SHA)"
        value: ${{ jobs.docker.outputs.image_tag }}
  pull_request:
    branches: [master2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/app

jobs:
  quality:
    name: Lint + TypeCheck + Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Security check
        run: |
          if grep -rE "(password|secret|api_key|token)\s*=\s*[\"'].*[\"']" src/ \
            --exclude-dir=node_modules --exclude="*.test.*" | grep -v "example" | grep -v "CHANGE_ME"; then
            echo "ERROR: Hardcoded secrets found in src/"
            exit 1
          fi

      - name: Check no .env.production tracked
        run: |
          if git ls-files | grep -q ".env.production"; then
            echo "ERROR: .env.production is tracked by git!"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fences_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fences_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory not found"
            exit 1
          fi
          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone not found (output: 'standalone' required)"
            exit 1
          fi
          echo "Build size: $(du -sh .next | cut -f1)"

  docker:
    name: Docker Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master2'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:dummy@localhost:5432/fences
          network: host

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
