name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check for security issues
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r -E "(password|secret|api_key|token)\s*=\s*[\"'].*[\"']" src/ --exclude-dir=node_modules --exclude="*.test.*" | grep -v "example"; then
            echo "WARNING: Found potential hardcoded secrets"
            exit 1
          fi
          echo "✓ No hardcoded secrets found"

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - name: Check migration status
        run: |
          echo "Checking for pending migrations..."
          if [ -d "prisma/migrations" ]; then
            echo "✓ Migrations directory found"
            ls -la prisma/migrations/
          else
            echo "⚠ No migrations directory"
          fi

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"
