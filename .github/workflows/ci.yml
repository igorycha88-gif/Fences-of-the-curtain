name: CI

on:
  workflow_call:
  pull_request:
    branches: [master2]
  push:
    branches: [master2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint + TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Security check
        run: |
          if grep -rE "(password|secret|api_key|token)\s*=\s*[\"'].*[\"']" src/ \
            --exclude-dir=node_modules --exclude="*.test.*" | grep -v "example"; then
            echo "ERROR: Hardcoded secrets found"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fences_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fences_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory not found"
            exit 1
          fi
          echo "Build size: $(du -sh .next | cut -f1)"
