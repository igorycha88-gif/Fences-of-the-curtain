name: Deploy to VPS

on:
  repository_dispatch:
    types: [deploy-triggered]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /root/Fences-of-the-curtain
            
            # Backup current deployment
            sudo -u postgres pg_dump -U postgres fences > backup_$(date +%Y%m%d_%H%M%S).sql || true
            
            # Pull latest changes
            git fetch origin
            git reset --hard origin/master
            
            # Clean build cache
            rm -rf .next
            
            # Install dependencies
            npm install --legacy-peer-deps --silent
            
            # Generate Prisma Client
            npx prisma generate
            
            # Build application
            npm run build --legacy-peer-deps
            
            # Push schema changes to database
            npx prisma db push --accept-data-loss
            
            # Stop and clean up PM2 processes
            pm2 stop fences-app 2>/dev/null || true
            pm2 delete fences-app 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 2
            
            # Start application with PM2
            pm2 start npm --name "fences-app" -- start
            pm2 save
            
            # Health check with retries
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -f http://localhost:3000/; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Attempt $i failed, checking PM2 logs..."
              pm2 logs fences-app --lines 30 --nostream || true
              sleep 5
            done
            echo "All health checks failed, showing final logs..."
            pm2 logs fences-app --lines 50 --nostream || true
            exit 1
