name: Deploy to VPS

# DEPLOYMENT REQUIREMENTS:
# 
# Before using this workflow, ensure the following secrets are configured in GitHub repository settings:
# 
# Required GitHub Secrets:
# - SSH_PASSWORD: SSH password for server access
# - SSH_PORT: SSH port (default: 22)
# 
# Required Server Environment Variables (MUST be set on VPS):
# - NEXTAUTH_SECRET: Minimum 32 characters, generated with: openssl rand -base64 32
#   ⚠️ DO NOT use placeholder values like "your-super-secret-key" or "change-in-production"
#   ⚠️ The application will NOT start with invalid NEXTAUTH_SECRET
# - DATABASE_URL: PostgreSQL connection string
# - REDIS_URL: Redis connection string
# - NEXTAUTH_URL: Your production URL (e.g., https://yourdomain.com)
# - Other variables: see .env.example for complete list
# 
# Security Notes:
# - NEVER commit .env file to repository
# - Use server environment variables or secrets management
# - NEXTAUTH_SECRET validation happens at application startup
# - Invalid NEXTAUTH_SECRET will cause deployment to fail

on:
  repository_dispatch:
    types: [deploy-triggered]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            
            APP_DIR="/root/Fences-of-the-curtain"
            APP_NAME="fences-app"
            
            cd $APP_DIR
            
            echo "=== Checking environment ==="
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi
            
            echo "=== Creating backup ==="
            BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
            sudo -u postgres pg_dump -U postgres fences > "$BACKUP_FILE" || echo "Warning: Backup failed, continuing..."
            
            echo "=== Storing current commit for rollback ==="
            CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Current commit: $CURRENT_COMMIT"
            
            echo "=== Pulling latest changes ==="
            git fetch origin
            git reset --hard origin/master
            
            echo "=== Installing dependencies ==="
            npm install --legacy-peer-deps
            
            echo "=== Generating Prisma Client ==="
            npx prisma generate
            
            echo "=== Building application ==="
            npm run build
            
            echo "=== Pushing schema changes ==="
            npx prisma db push --accept-data-loss
            
            echo "=== Graceful restart with PM2 ==="
            if pm2 list | grep -q "$APP_NAME"; then
              echo "Reloading existing process..."
              pm2 reload $APP_NAME --update-env || pm2 restart $APP_NAME
            else
              echo "Starting new process..."
              pm2 start npm --name "$APP_NAME" -- start
            fi
            pm2 save
            
            echo "=== Health check (10 attempts, 5s each) ==="
            SUCCESS=0
            for i in $(seq 1 10); do
              sleep 5
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "Health check passed on attempt $i!"
                SUCCESS=1
                break
              fi
              echo "Attempt $i/10 failed..."
              if [ $i -eq 3 ] || [ $i -eq 6 ]; then
                echo "=== PM2 logs at attempt $i ==="
                pm2 logs $APP_NAME --lines 20 --nostream || true
              fi
            done
            
            if [ $SUCCESS -eq 0 ]; then
              echo "=== DEPLOYMENT FAILED ==="
              echo "=== Final PM2 logs ==="
              pm2 logs $APP_NAME --lines 100 --nostream || true
              echo "=== PM2 status ==="
              pm2 list
              exit 1
            fi
            
            echo "=== Deployment successful! ==="
            pm2 list
