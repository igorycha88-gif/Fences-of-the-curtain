name: Deploy to VPS

# DEPLOYMENT REQUIREMENTS:
# 
# Before using this workflow, ensure the following secrets are configured in GitHub repository settings:
# 
# Required GitHub Secrets:
# - SSH_PASSWORD: SSH password for server access
# - SSH_PORT: SSH port (default: 22)
# 
# Required Server Environment Variables (MUST be set on VPS):
# - NEXTAUTH_SECRET: Minimum 32 characters, generated with: openssl rand -base64 32
#   ⚠️ DO NOT use placeholder values like "your-super-secret-key" or "change-in-production"
#   ⚠️ The application will NOT start with invalid NEXTAUTH_SECRET
# - DATABASE_URL: PostgreSQL connection string
# - REDIS_URL: Redis connection string
# - NEXTAUTH_URL: Your production URL (e.g., https://yourdomain.com)
# - Other variables: see .env.example for complete list
# 
# Security Notes:
# - NEVER commit .env file to repository
# - Use server environment variables or secrets management
# - NEXTAUTH_SECRET validation happens at application startup
# - Invalid NEXTAUTH_SECRET will cause deployment to fail
#
# Rollback:
# - Automatic rollback on failed health check
# - Manual rollback: ./scripts/rollback.sh <commit-or-tag>

on:
  repository_dispatch:
    types: [deploy-triggered]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            
            APP_DIR="/root/Fences-of-the-curtain"
            APP_NAME="fences-app"
            LOG_DIR="/var/log/fences-deploy"
            DEPLOY_LOG="$LOG_DIR/deploy.log"
            
            mkdir -p "$LOG_DIR"
            mkdir -p /var/log/fences-app
            
            log_deploy() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$DEPLOY_LOG"
            }
            
            cd $APP_DIR
            
            log_deploy "=== DEPLOY STARTED ==="
            log_deploy "Initiator: ${GITHUB_ACTOR:-manual}"
            
            log_deploy "=== Checking environment ==="
            if [ ! -f .env ]; then
              log_deploy "ERROR: .env file not found!"
              exit 1
            fi
            
            log_deploy "=== Saving current state for rollback ==="
            PREVIOUS_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            BACKUP_TAG="deploy-backup-$(date +%Y%m%d%H%M%S)"
            git tag "$BACKUP_TAG" 2>/dev/null || true
            log_deploy "Previous commit: $PREVIOUS_COMMIT"
            log_deploy "Backup tag: $BACKUP_TAG"
            
            log_deploy "=== Creating database backup ==="
            BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
            sudo -u postgres pg_dump -U postgres fences > "$BACKUP_FILE" || log_deploy "Warning: Backup failed, continuing..."
            
            log_deploy "=== Pulling latest changes ==="
            git fetch origin
            
            TARGET_COMMIT=$(git rev-parse origin/master)
            log_deploy "Target commit: $TARGET_COMMIT"
            
            git reset --hard origin/master
            
            log_deploy "=== Installing dependencies ==="
            npm install --legacy-peer-deps
            
            log_deploy "=== Generating Prisma Client ==="
            npx prisma generate
            
            log_deploy "=== Building application ==="
            npm run build
            
