name: Deploy to VPS

# DEPLOYMENT REQUIREMENTS:
# 
# Before using this workflow, ensure the following secrets are configured in GitHub repository settings:
# 
# Required GitHub Secrets:
# - SSH_PASSWORD: SSH password for server access
# - SSH_PORT: SSH port (default: 22)
# 
# Required Server Environment Variables (MUST be set on VPS):
# - NEXTAUTH_SECRET: Minimum 32 characters, generated with: openssl rand -base64 32
#   ⚠️ DO NOT use placeholder values like "your-super-secret-key" or "change-in-production"
#   ⚠️ The application will NOT start with invalid NEXTAUTH_SECRET
# - DATABASE_URL: PostgreSQL connection string
# - REDIS_URL: Redis connection string
# - NEXTAUTH_URL: Your production URL (e.g., https://yourdomain.com)
# - Other variables: see .env.example for complete list
# 
# Security Notes:
# - NEVER commit .env file to repository
# - Use server environment variables or secrets management
# - NEXTAUTH_SECRET validation happens at application startup
# - Invalid NEXTAUTH_SECRET will cause deployment to fail

on:
  repository_dispatch:
    types: [deploy-triggered]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /root/Fences-of-the-curtain
            
            # Backup current deployment
            sudo -u postgres pg_dump -U postgres fences > backup_$(date +%Y%m%d_%H%M%S).sql || true
            
            # Pull latest changes
            git fetch origin
            git reset --hard origin/master
            
            # Clean build cache
            rm -rf .next
            
            # Install dependencies
            npm install --legacy-peer-deps --silent
            
            # Generate Prisma Client
            npx prisma generate
            
            # Build application
            npm run build --legacy-peer-deps
            
            # Push schema changes to database
            npx prisma db push --accept-data-loss
            
            # Stop and clean up PM2 processes
            pm2 stop fences-app 2>/dev/null || true
            pm2 delete fences-app 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 2
            
            # Start application with PM2
            pm2 start npm --name "fences-app" -- start
            pm2 save
            
            # Health check
            sleep 5
            curl -f http://localhost:3000/ || exit 1
