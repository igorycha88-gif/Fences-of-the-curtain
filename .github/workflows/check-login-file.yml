name: Check Login File on VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-file:
    runs-on: ubuntu-latest

    steps:
      - name: Check login page file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            
            APP_DIR="/root/Fences-of-the-curtain"
            
            cd $APP_DIR
            
            echo "=== Checking login page file ==="
            echo "Last 20 lines of src/app/admin/login/page.tsx:"
            tail -20 src/app/admin/login/page.tsx
            
            echo ""
            echo "=== Searching for test credentials ==="
            grep -n "Тестовые данные\|admin@fences.ru\|manager@fences.ru" src/app/admin/login/page.tsx || echo "No test credentials found"
            
            echo ""
            echo "=== Git status ==="
            git log --oneline -5
            
            echo ""
            echo "=== Current commit ==="
            git rev-parse HEAD
