name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to rollback to (e.g. sha-abc1234, latest)'
        required: true
        default: 'latest'
      reason:
        description: 'Reason for rollback'
        required: true
        default: 'Manual rollback'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fences-of-the-curtain/app

jobs:
  list-images:
    name: List Available Images
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: List recent tags
        run: |
          echo "=== Recent image tags ==="
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TOKEN=$(echo ${{ secrets.GITHUB_TOKEN }} | base64)
          TAGS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${{ github.repository }}/app/tags/list" 2>/dev/null || echo "{}")
          echo "$TAGS" | python3 -m json.tool 2>/dev/null || echo "Could not list tags (may need GHCR package permissions)"
          echo ""
          echo "Rolling back to: ${{ github.event.inputs.image_tag }}"

  rollback:
    name: Rollback to Selected Image
    runs-on: ubuntu-latest
    needs: list-images
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}"
          echo "Verifying rollback image: $IMAGE"
          docker pull "$IMAGE" --quiet || {
            echo "ERROR: Image not found: $IMAGE"
            echo "Cannot rollback — image does not exist in GHCR"
            exit 1
          }
          echo "Image verified"

      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            export GITHUB_REPOSITORY="${{ github.repository }}"

            APP_DIR="/root/Fences-of-the-curtain"
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            ROLLBACK_REASON="${{ github.event.inputs.reason }}"

            cd "$APP_DIR"

            # Login to GHCR on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            if [ -f scripts/rollback-vps.sh ]; then
                bash scripts/rollback-vps.sh "$IMAGE_TAG" "$ROLLBACK_REASON"
            else
                echo "ERROR: scripts/rollback-vps.sh not found"
                exit 1
            fi

      - name: Verify rollback health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -euo pipefail
            APP_PORT=3001
            HEALTH=$(curl -sf --max-time 5 "http://127.0.0.1:${APP_PORT}/api/health" 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q '"status":"ok"'; then
                echo "Rollback health check: OK"
                echo "$HEALTH"
            else
                echo "WARNING: Rollback health check failed"
                echo "$HEALTH"
                docker logs fences-app --tail=20
                exit 1
            fi

      - name: Notify Telegram (Rollback Success)
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30s
          script: |
            source /root/Fences-of-the-curtain/.env 2>/dev/null || true
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                MESSAGE="🔄 *Откат выполнен*%0A%0AОбраз: \`${{ github.event.inputs.image_tag }}\`%0AПричина: ${{ github.event.inputs.reason }}%0AИнициатор: ${{ github.actor }}"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MESSAGE}\", \"parse_mode\": \"Markdown\"}" > /dev/null 2>&1 || true
            fi

      - name: Notify Telegram (Rollback Failed)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30s
          script: |
            source /root/Fences-of-the-curtain/.env 2>/dev/null || true
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                MESSAGE="🚨 *Откат FAILED*%0A%0AОбраз: \`${{ github.event.inputs.image_tag }}\`%0AИнициатор: ${{ github.actor }}%0A%0A_Требуется ручное вмешательство!_"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MESSAGE}\", \"parse_mode\": \"Markdown\"}" > /dev/null 2>&1 || true
            fi
