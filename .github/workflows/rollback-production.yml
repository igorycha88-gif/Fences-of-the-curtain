name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: 'Git ref to rollback to (commit SHA, tag, or branch)'
        required: true
        default: 'HEAD~1'
      reason:
        description: 'Reason for rollback'
        required: true
        default: 'Manual rollback'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Rollback via SSH (with Grafana verification)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="/root/Fences-of-the-curtain"
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.monitoring.yml"
            APP_PORT="3001"
            GRAFANA_PORT="3002"
            LOG_DIR="/var/log/fences-deploy"
            ROLLBACK_LOG="$LOG_DIR/rollback-$(date +%Y%m%d-%H%M%S).log"
            ROLLBACK_REF="${{ github.event.inputs.rollback_ref }}"
            ROLLBACK_REASON="${{ github.event.inputs.reason }}"
            GRAFANA_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD:-SecureGrafanaPass2026!}"

            mkdir -p "$LOG_DIR"
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$ROLLBACK_LOG"; }

            log "=== ROLLBACK STARTED ==="
            log "Target ref: $ROLLBACK_REF"
            log "Reason: $ROLLBACK_REASON"
            log "Initiator: ${GITHUB_ACTOR:-manual}"

            ROLLBACK_START=$(date +%s)
            cd "$APP_DIR"

            # ── 1. Save current state ──
            CURRENT_COMMIT=$(git rev-parse HEAD)
            log "Current commit: $CURRENT_COMMIT"

            # ── 2. Database backup before rollback ──
            BACKUP_FILE="$APP_DIR/backups/db_pre_rollback_$(date +%Y%m%d_%H%M%S).sql"
            mkdir -p "$APP_DIR/backups"
            sudo -u postgres pg_dump -U postgres fences > "$BACKUP_FILE" 2>/dev/null || {
              pg_dump -U postgres fences > "$BACKUP_FILE" 2>/dev/null || log "WARN: DB backup failed"
            }
            if [ -f "$BACKUP_FILE" ]; then
              log "✓ Pre-rollback DB backup: $(du -h "$BACKUP_FILE" | cut -f1)"
            fi

            # ── 3. Resolve target ref ──
            TARGET_COMMIT=$(git rev-parse "$ROLLBACK_REF" 2>/dev/null || {
              log "FATAL: Cannot resolve ref: $ROLLBACK_REF"
              exit 1
            })
            log "Rollback target: $TARGET_COMMIT"

            if [ "$CURRENT_COMMIT" = "$TARGET_COMMIT" ]; then
              log "ERROR: Already at target commit, nothing to rollback"
              exit 1
            fi

            # ── 4. Tag current state as backup ──
            git tag "pre-rollback-$(date +%Y%m%d%H%M%S)" "$CURRENT_COMMIT" 2>/dev/null || true
            log "Tagged current state for safety"

            # ── 5. Checkout target ──
            git fetch origin
            git reset --hard "$TARGET_COMMIT"
            log "✓ Code rolled back to $TARGET_COMMIT"

            # ── 6. Reinstall deps + migrate ──
            npm ci --legacy-peer-deps --no-audit --no-fund 2>/dev/null || {
              log "npm ci failed, falling back to npm install"
              npm install --legacy-peer-deps --no-audit --no-fund
            }
            npx prisma generate
            npx prisma migrate deploy 2>/dev/null || {
              log "WARN: Migration failed during rollback"
              npx prisma migrate status || true
            }

            # ── 7. Full rebuild ALL services ──
            BUILD_START=$(date +%s)
            log "Rebuilding ALL Docker images..."
            docker compose $COMPOSE_FILES build --no-cache 2>&1 | tail -10
            BUILD_TIME=$(( $(date +%s) - BUILD_START ))
            log "✓ Build completed in ${BUILD_TIME}s"

            # ── 8. Full recreate ALL services ──
            log "Starting ALL containers..."
            docker compose $COMPOSE_FILES up -d --force-recreate 2>&1
            sleep 20

            # ── 9. Health check ──
            HEALTH_OK=0
            for i in 1 2 3 4 5 6; do
              HEALTH=$(curl -sf --max-time 5 "http://127.0.0.1:${APP_PORT}/api/health" 2>/dev/null || echo "")
              if echo "$HEALTH" | grep -q '"status":"ok"'; then
                log "✓ Health check passed (attempt $i)"
                HEALTH_OK=1
                break
              fi
              log "Health check attempt $i failed"
              sleep 10
            done

            if [ "$HEALTH_OK" -eq 0 ]; then
              log "FATAL: Rollback deployment failed — health check not passed"
              log "Restoring to previous commit: $CURRENT_COMMIT"
              git reset --hard "$CURRENT_COMMIT"
              docker compose $COMPOSE_FILES build --no-cache 2>&1 | tail -3
              docker compose $COMPOSE_FILES up -d --force-recreate 2>&1
              sleep 20
              log "Restored to $CURRENT_COMMIT"
              docker compose $COMPOSE_FILES logs --tail=50 2>&1
              exit 1
            fi

            # ── 10. Check Grafana health + datasource + dashboards ──
            sleep 10
            GRAFANA_OK=0
            for i in 1 2 3; do
              if curl -sf --max-time 5 "http://127.0.0.1:${GRAFANA_PORT}/api/health" | grep -q '"database":"ok"'; then
                log "✓ Grafana health check passed (attempt $i)"
                GRAFANA_OK=1
                break
              fi
              sleep 10
            done

            if [ "$GRAFANA_OK" -eq 1 ]; then
              docker exec fences-grafana grafana-cli admin reset-admin-password "$GRAFANA_ADMIN_PASSWORD" 2>&1 | tail -1

              # Verify datasource
              DS_STATUS=$(curl -sf -u "admin:$GRAFANA_ADMIN_PASSWORD" \
                "http://127.0.0.1:${GRAFANA_PORT}/api/datasources/uid/prometheus/health" 2>/dev/null || echo "")
              if echo "$DS_STATUS" | grep -q '"status":"OK"'; then
                log "✓ Prometheus datasource connected after rollback"
              else
                log "WARN: Prometheus datasource issue: $DS_STATUS"
              fi

              # Verify dashboards
              DASHBOARD_COUNT=$(curl -sf -u "admin:$GRAFANA_ADMIN_PASSWORD" \
                "http://127.0.0.1:${GRAFANA_PORT}/api/search?type=dash-db" 2>/dev/null | \
                python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
              log "Grafana dashboards after rollback: $DASHBOARD_COUNT"

              if [ "$DASHBOARD_COUNT" -lt 6 ]; then
                log "WARN: Only $DASHBOARD_COUNT dashboards found (expected 6)"
                docker exec fences-grafana ls -la /etc/grafana/provisioning/dashboards/imported/ 2>&1
              else
                log "✓ All 6 Grafana dashboards present after rollback"
              fi
            else
              log "WARN: Grafana not healthy after rollback"
            fi

            # ── 11. Verify Prometheus targets ──
            DOWN_TARGETS=$(curl -sf http://127.0.0.1:9090/api/v1/targets 2>/dev/null | \
              python3 -c "import sys,json; data=json.load(sys.stdin); down=[t['scrapeUrl'] for t in data['data']['activeTargets'] if t['health']!='up']; print(len(down))" 2>/dev/null || echo "unknown")
            log "Prometheus targets down after rollback: $DOWN_TARGETS"

            # ── 12. Success ──
            ROLLBACK_TIME=$(( $(date +%s) - ROLLBACK_START ))
            log "=== ROLLBACK SUCCESSFUL ==="
            log "Time: ${ROLLBACK_TIME}s (build: ${BUILD_TIME}s)"
            log "Rolled back from $CURRENT_COMMIT to $TARGET_COMMIT"

            docker compose $COMPOSE_FILES ps
            curl -s "http://127.0.0.1:${APP_PORT}/api/health"

            log "=== ROLLBACK FINISHED ==="
