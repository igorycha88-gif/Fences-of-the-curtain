name: Check PM2 Config on VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pm2:
    runs-on: ubuntu-latest

    steps:
      - name: Check PM2 configuration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            
            echo "=== PM2 configuration ==="
            pm2 show fences-app
            
            echo ""
            echo "=== PM2 ecosystem file ==="
            if [ -f ecosystem.config.js ]; then
              cat ecosystem.config.js
            fi
            
            echo ""
            echo "=== Working directories ==="
            ls -la /root/.pm2/logs/
            
            echo ""
            echo "=== Checking running process ==="
            PM2_CWD=$(pm2 show fences-app --json | grep -o '"cwd":"[^"]*"' | cut -d'"' -f4)
            echo "PM2 CWD: $PM2_CWD"
            
            echo ""
            echo "=== Files in PM2 CWD ==="
            if [ -n "$PM2_CWD" ]; then
              cd "$PM2_CWD"
              ls -la
              
              echo ""
              echo "=== Checking login page in PM2 CWD ==="
              if [ -f src/app/admin/login/page.tsx ]; then
                echo "Lines 100-117 in PM2 CWD:"
                sed -n '100,117p' src/app/admin/login/page.tsx
                
                echo ""
                grep -n "Тестовые данные\|admin@fences.ru\|manager@fences.ru" src/app/admin/login/page.tsx || echo "✓ No test credentials in PM2 CWD"
              fi
            fi
            
            echo ""
            echo "=== Checking .next in PM2 CWD ==="
            if [ -n "$PM2_CWD" ] && [ -d "$PM2_CWD/.next" ]; then
              cd "$PM2_CWD/.next"
              find . -name "*login*" -type f | head -10
            fi
