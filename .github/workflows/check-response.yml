name: Check Response on VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-response:
    runs-on: ubuntu-latest

    steps:
      - name: Check login page HTML response
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            
            APP_DIR="/root/Fences-of-the-curtain"
            
            cd $APP_DIR
            
            echo "=== Checking built files ==="
            if [ -d .next ]; then
              echo "Checking if login page exists in .next:"
              find .next -name "*login*" -type f | head -10
              
              echo ""
              echo "Checking .next server pages:"
              ls -la .next/server/app/admin/login/ 2>/dev/null || echo "Directory not found"
            fi
            
            echo ""
            echo "=== Checking PM2 process ==="
            pm2 list
            
            echo ""
            echo "=== Checking port 3000 ==="
            curl -s http://localhost:3000/admin/login | grep -o "Тестовые данные\|admin@fences.ru\|manager@fences.ru" | head -5 || echo "No test credentials in HTML response"
            
            echo ""
            echo "=== Checking Nginx config ==="
            if [ -f /etc/nginx/sites-available/default ]; then
              echo "Static cache settings:"
              grep -i "cache" /etc/nginx/sites-available/default || echo "No cache settings found"
            fi
