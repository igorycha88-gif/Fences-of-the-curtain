name: CI with Smoke Tests (Enhanced)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check for security issues
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r -E "(password|secret|api_key|token)\s*=\s*[\"'].*[\"']" src/ --exclude-dir=node_modules --exclude="*.test.*" | grep -v "example"; then
            echo "WARNING: Found potential hardcoded secrets"
            exit 1
          fi
          echo "✓ No hardcoded secrets found"

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          TODO_COUNT=$(grep -r "TODO" src/ --exclude-dir=node_modules | wc -l || echo "0")
          echo "Found $TODO_COUNT TODO comments"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh .next | cut -f1)
          echo "Build size: $BUILD_SIZE"
          
          if [ -d ".next/static" ]; then
            STATIC_SIZE=$(du -sh .next/static | cut -f1)
            echo "Static assets size: $STATIC_SIZE"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fences_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/fences_test"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --production --audit-level=moderate || echo "Audit found moderate vulnerabilities"

      - name: Check dependencies
        run: |
          echo "Checking for outdated dependencies..."
          npm outdated || echo "All dependencies are up to date"

  docker-lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile --target base -t fences-base:latest .
          docker build -f docker/Dockerfile -t fences-test:latest .

      - name: Check Docker image size
        run: |
          echo "Checking Docker image sizes..."
          docker images | grep fences
          
          BASE_SIZE=$(docker images fences-base:latest --format "{{.Size}}")
          TEST_SIZE=$(docker images fences-test:latest --format "{{.Size}}")
          
          echo "Base image size: $BASE_SIZE"
          echo "Test image size: $TEST_SIZE"
