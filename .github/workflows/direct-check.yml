name: Direct File Check on VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-check:
    runs-on: ubuntu-latest

    steps:
      - name: Direct file check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            
            APP_DIR="/root/Fences-of-the-curtain"
            
            cd $APP_DIR
            
            echo "=== Checking source file ==="
            echo "Lines 100-117 of src/app/admin/login/page.tsx:"
            sed -n '100,117p' src/app/admin/login/page.tsx
            
            echo ""
            echo "=== Checking for test credentials in source ==="
            grep -n "Тестовые данные\|admin@fences.ru\|manager@fences.ru" src/app/admin/login/page.tsx || echo "✓ No test credentials in source file"
            
            echo ""
            echo "=== Checking built files content ==="
            if [ -f .next/server/app/admin/login.html ]; then
              echo "Last 30 lines of .next/server/app/admin/login.html:"
              tail -30 .next/server/app/admin/login.html
            fi
            
            echo ""
            echo "=== Checking standalone build ==="
            if [ -f .next/standalone/.next/server/app/admin/login.html ]; then
              echo "Last 30 lines of standalone login.html:"
              tail -30 .next/standalone/.next/server/app/admin/login.html
            fi
