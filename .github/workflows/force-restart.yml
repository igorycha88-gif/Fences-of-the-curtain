name: Force Restart PM2 on VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  force-restart:
    runs-on: ubuntu-latest

    steps:
      - name: Force restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.143.13.196
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            
            APP_DIR="/root/Fences-of-the-curtain"
            APP_NAME="fences-app"
            
            cd $APP_DIR
            
            echo "=== Killing all Node.js processes ==="
            pkill -9 -f node || echo "No Node.js processes to kill"
            pkill -9 -f npm || echo "No npm processes to kill"
            
            sleep 2
            
            echo "=== Removing all PM2 processes ==="
            pm2 delete all || echo "No PM2 processes to delete"
            
            sleep 2
            
            echo "=== Starting fresh PM2 process ==="
            pm2 start npm --name "$APP_NAME" -- start
            pm2 save
            
            echo "=== Waiting for application to start ==="
            sleep 10
            
            echo "=== Health check ==="
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "✓ Health check passed"
            else
              echo "✗ Health check failed"
              pm2 logs $APP_NAME --lines 100 --nostream
              exit 1
            fi
            
            echo ""
            echo "=== Final verification ==="
            FINAL_CHECK=$(curl -s http://localhost:3000/admin/login | grep -o "Тестовые данные\|admin@fences.ru\|manager@fences.ru" | head -1 || echo "NONE")
            if [ "$FINAL_CHECK" != "NONE" ]; then
              echo "✗ ERROR: Test credentials still present!"
              exit 1
            else
              echo "✓ SUCCESS: No test credentials!"
            fi
            
            echo ""
            echo "=== PM2 status ==="
            pm2 list
