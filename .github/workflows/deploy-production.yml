name: Deploy to Production

on:
  push:
    branches: [master2]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'
      image_tag:
        description: 'Specific image tag to deploy (default: sha-XXXX from current commit)'
        required: false
        default: ''
      skip_smoke_tests:
        description: 'Skip smoke tests after deploy'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/app
  APP_DIR: "/root/Fences-of-the-curtain"
  APP_PORT: "3001"
  GREEN_PORT: "3003"

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to VPS (Blue-Green)
    runs-on: ubuntu-latest
    needs: ci
    if: always() && !cancelled() && needs.ci.result == 'success'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to GHCR (for pull access on runner)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists in GHCR
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}"
          echo "Verifying image: $IMAGE"
          docker pull "$IMAGE" --quiet || {
            echo "ERROR: Image not found: $IMAGE"
            echo "Available tags may differ. Check GHCR package."
            exit 1
          }
          echo "Image verified: $IMAGE"

      - name: Deploy via SSH (Blue-Green with Nginx switching)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_ACTOR="${{ github.actor }}"

            APP_DIR="/root/Fences-of-the-curtain"
            IMAGE_TAG="${{ steps.image.outputs.tag }}"
            COMMIT_SHA="${{ github.sha }}"
            DEPLOY_REASON="${{ github.event.inputs.reason || 'Push to master2' }}"
            SKIP_SMOKE="${{ github.event.inputs.skip_smoke_tests || 'false' }}"

            cd "$APP_DIR"

            # Login to GHCR on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            # Copy deploy script to VPS
            if [ -f scripts/deploy-vps.sh ]; then
                bash scripts/deploy-vps.sh "$IMAGE_TAG" "$COMMIT_SHA" "$DEPLOY_REASON"
            else
                echo "ERROR: scripts/deploy-vps.sh not found"
                exit 1
            fi

            # If smoke tests should be skipped
            if [ "$SKIP_SMOKE" = "true" ]; then
                echo "[deploy] Smoke tests skipped by user request"
            fi

      - name: Run post-deploy smoke tests
        if: ${{ github.event.inputs.skip_smoke_tests != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP_PORT=3001

            echo "=== POST-DEPLOY SMOKE TESTS ==="

            PASS=0
            FAIL=0

            test_endpoint() {
                local name="$1" method="$2" url="$3" expected="$4"
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X "$method" "$url" 2>/dev/null || echo "000")
                if [ "$CODE" = "$expected" ]; then
                    echo "  OK: $name ($CODE)"
                    PASS=$((PASS + 1))
                else
                    echo "  FAIL: $name (got $CODE, expected $expected)"
                    FAIL=$((FAIL + 1))
                fi
            }

            test_endpoint "Health" "GET" "http://127.0.0.1:${APP_PORT}/api/health" "200"
            test_endpoint "Homepage" "GET" "http://127.0.0.1:${APP_PORT}/" "200"
            test_endpoint "Admin Login" "GET" "http://127.0.0.1:${APP_PORT}/admin/login" "200"
            test_endpoint "Materials API" "GET" "http://127.0.0.1:${APP_PORT}/api/materials" "200"

            echo ""
            echo "=== SMOKE: $PASS passed, $FAIL failed ==="

            if [ "$FAIL" -gt 0 ]; then
                echo "SMOKE TESTS FAILED"
                exit 1
            fi

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30s
          script: |
            source /root/Fences-of-the-curtain/.env 2>/dev/null || true
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                SHORT_SHA="${{ steps.image.outputs.short_sha }}"
                MESSAGE="✅ *Деплой успешен*%0A%0AВерсия: \`${SHORT_SHA}\`%0AОбраз: \`${{ steps.image.outputs.tag }}\`%0AИнициатор: ${{ github.actor }}%0AПричина: ${{ github.event.inputs.reason || 'Push to master2' }}"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MESSAGE}\", \"parse_mode\": \"Markdown\"}" > /dev/null 2>&1 || true
            fi

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30s
          script: |
            source /root/Fences-of-the-curtain/.env 2>/dev/null || true
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                SHORT_SHA="${{ steps.image.outputs.short_sha }}"
                MESSAGE="❌ *Деплой FAILED*%0A%0AВерсия: \`${SHORT_SHA}\`%0AИнициатор: ${{ github.actor }}%0A%0A_Проверьте логи: /var/log/fences-deploy/_"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MESSAGE}\", \"parse_mode\": \"Markdown\"}" > /dev/null 2>&1 || true
            fi
