name: CI/CD Pipeline

on:
  push:
    branches: [master2]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'
      skip_deploy:
        description: 'Skip deploy (CI only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fences-of-the-curtain/app

jobs:
  ci:
    name: CI Pipeline
    uses: ./.github/workflows/ci.yml
    with:
      run-coverage: false

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      short_sha: ${{ steps.image.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=semver,pattern={{version}},value=${{ steps.image.outputs.short_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:dummy@localhost:5432/fences
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://zabor-i-naves.ru' }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || '' }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID || '' }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID || '' }}
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY || '' }}
            NEXT_PUBLIC_YANDEX_ORG_ID=${{ secrets.NEXT_PUBLIC_YANDEX_ORG_ID || '' }}
            NEXT_PUBLIC_YANDEX_ORG_URL=${{ secrets.NEXT_PUBLIC_YANDEX_ORG_URL || '' }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL || 'https://zabor-i-naves.ru' }}

  deploy:
    name: Deploy to VPS (Blue-Green)
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ !inputs.skip_deploy }}
    environment: production
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        timeout-minutes: 3
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}"
          echo "Verifying: $IMAGE"
          docker pull "$IMAGE" --quiet || {
            echo "::error::Image not found: $IMAGE"
            exit 1
          }
          echo "Image verified: $IMAGE"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 20
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_ACTOR="${{ github.actor }}"

            APP_DIR="/root/Fences-of-the-curtain"
            cd "$APP_DIR"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            if [ -f scripts/deploy-vps.sh ]; then
                bash scripts/deploy-vps.sh "${{ needs.docker.outputs.image_tag }}" "${{ github.sha }}" "${{ inputs.reason || 'Push to master2' }}"
            else
                echo "ERROR: scripts/deploy-vps.sh not found"
                exit 1
            fi

      - name: Post-deploy smoke tests
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 3m
          script: |
            set -euo pipefail
            PASS=0; FAIL=0

            test_ep() {
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X "$1" "$2" 2>/dev/null || echo "000")
              if [ "$CODE" = "$3" ]; then echo "  OK: $4 ($CODE)"; PASS=$((PASS+1));
              else echo "  FAIL: $4 (got $CODE, expected $3)"; FAIL=$((FAIL+1)); fi
            }

            test_ep GET "http://127.0.0.1:3001/api/health" "200" "Health"
            test_ep GET "http://127.0.0.1:3001/" "200" "Homepage"
            test_ep GET "http://127.0.0.1:3001/admin/login" "200" "Admin Login"
            test_ep GET "http://127.0.0.1:3001/api/materials" "200" "Materials"

            echo "Smoke: $PASS passed, $FAIL failed"
            [ "$FAIL" -eq 0 ] || exit 1

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30s
          script: |
            source /root/Fences-of-the-curtain/.env 2>/dev/null || true
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"✅ Деплой успешен\nВерсия: ${{ needs.docker.outputs.short_sha }}\nОбраз: ${{ needs.docker.outputs.image_tag }}\nИнициатор: ${{ github.actor }}\"}" > /dev/null 2>&1 || true
            fi

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30s
          script: |
            source /root/Fences-of-the-curtain/.env 2>/dev/null || true
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"${TEGRAM_CHAT_ID}\", \"text\": \"❌ Деплой FAILED\nВерсия: ${{ needs.docker.outputs.short_sha }}\nИнициатор: ${{ github.actor }}\nПроверьте логи: /var/log/fences-deploy/\"}" > /dev/null 2>&1 || true
            fi
