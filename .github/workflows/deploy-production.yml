name: Deploy to Production

on:
  push:
    branches: [master2]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: "/root/Fences-of-the-curtain"
  APP_NAME: "fences-app"
  PORT: "3000"
  BASE_URL: "http://localhost:3000"

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: success() && github.ref == 'refs/heads/master'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '37.143.13.196' }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR="/root/Fences-of-the-curtain"
            APP_NAME="fences-app"
            BASE_URL="http://localhost:3000"
            LOG_DIR="/var/log/fences-deploy"
            DEPLOY_LOG="$LOG_DIR/deploy-$(date +%Y%m%d-%H%M%S).log"
            DEPLOY_REASON="${{ github.event.inputs.reason || 'Push to master' }}"

            mkdir -p "$LOG_DIR" /var/log/fences-app

            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$DEPLOY_LOG"; }

            log "=== DEPLOY STARTED ==="
            log "Commit: ${{ github.sha }}"
            log "Reason: $DEPLOY_REASON"
            log "Initiator: ${GITHUB_ACTOR:-manual}"

            DEPLOY_START=$(date +%s)

            # ── 1. Environment check ──
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              log "FATAL: .env not found"
              exit 1
            fi
            log "✓ Environment found"

            # ── 2. Save current state for rollback ──
            PREVIOUS_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            ROLLBACK_TAG="rollback-$(date +%Y%m%d%H%M%S)"
            git tag "$ROLLBACK_TAG" 2>/dev/null || true
            log "Previous: $PREVIOUS_COMMIT"
            log "Rollback tag: $ROLLBACK_TAG"

            # ── 3. Database backup ──
            BACKUP_FILE="$APP_DIR/backups/db_$(date +%Y%m%d_%H%M%S).sql"
            mkdir -p "$APP_DIR/backups"
            sudo -u postgres pg_dump -U postgres fences > "$BACKUP_FILE" 2>/dev/null || {
              pg_dump -U postgres fences > "$BACKUP_FILE" 2>/dev/null || log "WARN: DB backup failed"
            }
            if [ -f "$BACKUP_FILE" ]; then
              log "✓ DB backup: $(du -h "$BACKUP_FILE" | cut -f1)"
            fi

            # ── 4. Pull latest code ──
            git fetch origin
            TARGET_COMMIT=$(git rev-parse origin/master)
            log "Target: $TARGET_COMMIT"
            git reset --hard origin/master

            # ── 5. Install dependencies ──
            log "Installing dependencies..."
            npm ci --legacy-peer-deps --no-audit --no-fund 2>/dev/null || {
              log "npm ci failed, falling back to npm install"
              npm install --legacy-peer-deps --no-audit --no-fund
            }
            log "✓ Dependencies installed"

            # ── 6. Prisma ──
            npx prisma generate
            log "✓ Prisma client generated"

            npx prisma migrate deploy 2>/dev/null || {
              log "WARN: Migration failed, checking status..."
              npx prisma migrate status || true
            }
            log "✓ Migrations applied"

            # ── 7. Build ──
            BUILD_START=$(date +%s)
            npm run build
            BUILD_TIME=$(( $(date +%s) - BUILD_START ))
            log "✓ Build completed in ${BUILD_TIME}s"

            # ── 8. PM2 graceful restart ──
            if pm2 list | grep -q "$APP_NAME"; then
              log "Reloading PM2 process (zero-downtime)..."
              pm2 reload ecosystem.config.js || pm2 restart ecosystem.config.js
            else
              log "Starting new PM2 process..."
              pm2 start ecosystem.config.js
            fi
            pm2 save
            log "✓ PM2 restarted"

            # ── 9. Health check ──
            log "Waiting for application to stabilize..."
            sleep 15

            HEALTH_OK=0
            for i in 1 2 3 4 5; do
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$BASE_URL/api/health" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                log "✓ Health check passed (attempt $i)"
                HEALTH_OK=1
                break
              fi
              log "Health check attempt $i failed (HTTP $HTTP_CODE)"
              sleep 5
            done

            # ── 10. Rollback if needed ──
            if [ "$HEALTH_OK" -eq 0 ]; then
              log "=== DEPLOYMENT FAILED — AUTO ROLLBACK ==="

              log "Rolling back to: $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"

              log "Reinstalling..."
              npm ci --legacy-peer-deps --no-audit --no-fund 2>/dev/null || npm install --legacy-peer-deps --no-audit --no-fund
              npx prisma generate
              npm run build

              pm2 reload ecosystem.config.js || pm2 restart ecosystem.config.js
              pm2 save
              sleep 15

              if curl -sf --max-time 5 "$BASE_URL/api/health" > /dev/null 2>&1; then
                log "✓ Rollback successful"
              else
                log "FATAL: Rollback also failed — manual intervention required"
                pm2 logs "$APP_NAME" --lines 100 --nostream || true
              fi

              pm2 list
              git tag -d "$ROLLBACK_TAG" 2>/dev/null || true
              exit 1
            fi

            # ── 11. Success ──
            git tag -d "$ROLLBACK_TAG" 2>/dev/null || true

            DEPLOY_TIME=$(( $(date +%s) - DEPLOY_START ))
            log "=== DEPLOYMENT SUCCESSFUL ==="
            log "Time: ${DEPLOY_TIME}s (build: ${BUILD_TIME}s)"
            log "From $PREVIOUS_COMMIT to $TARGET_COMMIT"

            pm2 list
            curl -s "$BASE_URL/api/health" | head -c 200

            find "$APP_DIR/backups" -name "*.sql" -mtime +7 -delete 2>/dev/null || true
            find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true

            log "=== DEPLOY FINISHED ==="
