global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fences-local'
    environment: 'development'
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets:
          - 'host.docker.internal:9100'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'nextjs-app'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
    metrics_path: /api/metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'host.docker.internal:9187'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'host.docker.internal:9121'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
