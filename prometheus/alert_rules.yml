groups:
  - name: application_alerts
    interval: 30s
    rules:
      # Application Down
      - alert: ApplicationDown
        expr: up{job="nodejs"} == 0
        for: 1m
        labels:
          severity: critical
          service: "nextjs"
        annotations:
          summary: "Application is down"
          description: "Next.js application has been down for more than 1 minute"

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{job="nodejs",status="5xx"}[5m])
            > 10
          )
        for: 2m
        labels:
          severity: warning
          service: "nextjs"
        annotations:
          summary: "High error rate detected"
          description: "Error rate is greater than 10 requests/second for 2 minutes"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (
            process_resident_memory_bytes{job="nodejs"} /
            node_memory_MemTotal_bytes
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          service: "nodejs"
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90% for 5 minutes"

      # Critical Memory Usage
      - alert: CriticalMemoryUsage
        expr: |
          (
            process_resident_memory_bytes{job="nodejs"} /
            node_memory_MemTotal_bytes
          ) > 0.95
        for: 3m
        labels:
          severity: critical
          service: "nodejs"
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage is above 95% for 3 minutes"

  - name: database_alerts
    interval: 30s
    rules:
      # Database Down
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: "postgres"
        annotations:
          summary: "Database is down"
          description: "PostgreSQL has been down for more than 1 minute"

      # High Connection Count
      - alert: HighDatabaseConnections
        expr: |
          (
            pg_stat_database_numbackends{job="postgres"} /
            pg_settings_max_connections{job="postgres"}
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          service: "postgres"
        annotations:
          summary: "High database connections"
          description: "Database connections are above 80% of maximum"

      # Slow Queries
      - alert: SlowDatabaseQueries
        expr: |
          (
            rate(pg_stat_statements_calls_total{job="postgres"}[5m])
            > 100
          )
        for: 2m
        labels:
          severity: warning
          service: "postgres"
        annotations:
          summary: "High query rate"
          description: "Database query rate is above 100 queries/second for 2 minutes"

  - name: cache_alerts
    interval: 30s
    rules:
      # Redis Down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: "redis"
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      # High Memory Usage
      - alert: HighRedisMemory
        expr: |
          (
            redis_memory_used_bytes{job="redis"} /
            redis_memory_max_bytes{job="redis"}
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          service: "redis"
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is above 90% for 5 minutes"

      # High Eviction Rate
      - alert: HighRedisEviction
        expr: |
          rate(redis_evicted_keys_total{job="redis"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: "redis"
        annotations:
          summary: "High Redis eviction rate"
          description: "Redis is evicting more than 10 keys/second for 2 minutes"

  - name: proxy_alerts
    interval: 30s
    rules:
      # Nginx Down
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
          service: "nginx"
        annotations:
          summary: "Nginx is down"
          description: "Nginx has been down for more than 1 minute"

      # High Response Time
      - alert: HighResponseTime
        expr: |
          (
            histogram_quantile(0.95, rate(nginx_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 2m
        labels:
          severity: warning
          service: "nginx"
        annotations:
          summary: "High response time"
          description: "95th percentile response time is above 1 second for 2 minutes"

      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: |
          (
            rate(nginx_http_requests_total{job="nginx",status="HIT"}[5m]) /
            rate(nginx_http_requests_total{job="nginx"}[5m])
          ) < 0.7
        for: 5m
        labels:
          severity: warning
          service: "nginx"
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is below 70% for 5 minutes"

      # High 5xx Error Rate
      - alert: HighErrorRate5xx
        expr: |
          (
            rate(nginx_http_requests_total{job="nginx",status=~"5.."}[5m])
            > 10
          )
        for: 2m
        labels:
          severity: warning
          service: "nginx"
        annotations:
          summary: "High 5xx error rate"
          description: "Server error rate is above 10 requests/second for 2 minutes"
