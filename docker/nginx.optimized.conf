events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json application/atom+xml image/svg+xml;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    # Brotli Compression (if available)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json application/atom+xml image/svg+xml;

    # Proxy cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:50m max_size=500m inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie Expires Cache-Control;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=app_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=grafana_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream configuration
    upstream app {
        server fences-app:3000;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # Grafana на проде работает в network_mode: host и слушает на 127.0.0.1:3002.
    # В dev/standalone (docker-compose.monitoring.standalone.yml) Grafana в bridge-сети
    # как fences-grafana:3000 — для локального стенда upstream можно переопределить.
    upstream grafana {
        server 127.0.0.1:3002;
        keepalive 32;
    }

    # HTTP server - redirects to HTTPS for production, serves locally for development
    server {
        listen 80;
        server_name localhost _;

        client_max_body_size 20M;
        
        # Connection optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection limiting
        limit_conn conn_limit 100;

        # Cache bypass for logged-in users and POST requests
        set $skip_cache 0;
        if ($request_method = POST) {
            set $skip_cache 1;
        }
        if ($http_cookie ~* "(session|jwt|auth)") {
            set $skip_cache 1;
        }

        # Static files with long-term caching
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            try_files $uri =404;

            # Pre-compress files if available
            gzip_static on;
        }

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            limit_req zone=static_limit burst=200 nodelay;
        }

        # Next.js image optimization
        location /_next/image/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Proxy cache configuration
            proxy_cache app_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_valid 301 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_revalidate on;

            # Add cache status header
            add_header X-Cache-Status $upstream_cache_status;

            # Security headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting
            limit_req zone=app_limit burst=50 nodelay;

            # Buffer configuration
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
        }

        location /api/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Disable caching for API endpoints (except GET)
            proxy_cache off;

            # Security headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting for API
            limit_req zone=api_limit burst=100 nodelay;

            # Increase timeout for API requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer configuration
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 8 64k;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://app;
            proxy_cache off;
            access_log off;
        }

        # Nginx status and cache status (for monitoring)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        location /cache_status {
            proxy_cache app_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Cache-Key "$scheme$request_method$host$request_uri$is_args$args";
            return 200;
        }

        # Grafana - monitoring dashboard (basic auth protected)
        location /grafana/ {
            auth_basic "Grafana - Admin Only";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-WEBAUTH-USER $remote_user;

            # Disable caching for Grafana
            proxy_cache off;

            # WebSocket support for Grafana live
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Increase timeouts for Grafana queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Rate limiting for Grafana (higher limit for static assets)
            limit_req zone=grafana_limit burst=100 nodelay;
        }
    }

    # HTTPS server - production only
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (mount with docker-compose volume)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        client_max_body_size 20M;
        
        # Connection optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Connection limiting
        limit_conn conn_limit 100;

        # Cache bypass configuration (same as HTTP)
        set $skip_cache 0;
        if ($request_method = POST) {
            set $skip_cache 1;
        }
        if ($http_cookie ~* "(session|jwt|auth)") {
            set $skip_cache 1;
        }

        # Static files with long-term caching
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            try_files $uri =404;

            # Pre-compress files if available
            gzip_static on;
        }

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            limit_req zone=static_limit burst=200 nodelay;
        }

        # Next.js image optimization
        location /_next/image/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Proxy cache configuration
            proxy_cache app_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_valid 301 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_revalidate on;

            # Add cache status header
            add_header X-Cache-Status $upstream_cache_status;

            # Security headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting
            limit_req zone=app_limit burst=50 nodelay;

            # Buffer configuration
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
        }

        location /api/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Disable caching for API endpoints (except GET)
            proxy_cache off;

            # Security headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting for API
            limit_req zone=api_limit burst=100 nodelay;

            # Increase timeout for API requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer configuration
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 8 64k;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://app;
            proxy_cache off;
            access_log off;
        }

        # Nginx status and cache status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        location /cache_status {
            proxy_cache app_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Cache-Key "$scheme$request_method$host$request_uri$is_args$args";
            return 200;
        }

        # Grafana - monitoring dashboard (basic auth protected)
        location /grafana/ {
            auth_basic "Grafana - Admin Only";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-WEBAUTH-USER $remote_user;

            # Disable caching for Grafana
            proxy_cache off;

            # WebSocket support for Grafana live
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Increase timeouts for Grafana queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Rate limiting for Grafana (higher limit for static assets)
            limit_req zone=grafana_limit burst=100 nodelay;
        }
    }
}
