# ==============================================================================
# NGINX SNIPPET: location /grafana/
# ------------------------------------------------------------------------------
# Reverse proxy для Grafana за https://zabor-i-naves.ru/grafana
# Применяется на проде через scripts/setup-grafana-proxy.sh.
#
# Использование: внутри server { listen 443 ssl http2; ... } добавить
#     include /etc/nginx/snippets/grafana.conf;
#
# Слои защиты:
#   1) nginx basic auth (файл /etc/nginx/.htpasswd, пользователь admin)
#   2) встроенный логин Grafana (GF_SECURITY_ADMIN_USER/PASSWORD)
# ==============================================================================

location /grafana/ {
    auth_basic "Grafana - Admin Only";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://127.0.0.1:3002/grafana/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket — нужно для Grafana Live (real-time dashboards)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Кеширование Grafana отключаем (она сама управляет кешем)
    proxy_cache off;

    # Загрузка/экспорт дашбордов (CSV/JSON)
    client_max_body_size 20M;

    # Таймауты для долгих запросов (например, тяжёлые SQL-запросы Grafana)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
