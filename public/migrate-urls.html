<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миграция URL изображений</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0050c0;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Миграция URL изображений</h1>
        <p>Этот скрипт исправит URL изображений в базе данных, добавив ведущий слэш.</p>

        <div class="info">
            <strong>⚠️ Важно:</strong> Вы должны быть авторизованы как ADMIN для выполнения этой миграции.
            Если вы не авторизованы, скрипт вернёт ошибку 403 Forbidden.
        </div>

        <button id="runMigration" onclick="runMigration()">Запустить миграцию</button>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function runMigration() {
            const button = document.getElementById('runMigration');
            const resultDiv = document.getElementById('result');

            button.disabled = true;
            button.textContent = 'Выполняется...';

            try {
                const response = await fetch('/api/admin/portfolio/migrate-urls', {
                    method: 'POST',
                });

                const data = await response.json();

                resultDiv.style.display = 'block';
                resultDiv.className = 'result ' + (response.ok ? 'success' : 'error');

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h3>✅ Миграция выполнена успешно!</h3>
                        <p><strong>Обновлено записей:</strong> ${data.updatedCount}</p>
                        <p><strong>Всего записей:</strong> ${data.totalItems}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>❌ Ошибка миграции</h3>
                        <p><strong>${data.error}</strong></p>
                        ${data.details ? `<p><small>${data.details}</small></p>` : ''}
                        ${response.status === 403 ? '<p>⚠️ Убедитесь, что вы авторизованы как ADMIN</p>' : ''}
                    `;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Произошла ошибка</h3>
                    <p>${error.message}</p>
                `;
            } finally {
                button.disabled = false;
                button.textContent = 'Запустить миграцию';
            }
        }
    </script>
</body>
</html>
