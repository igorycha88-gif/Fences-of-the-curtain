services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: fences-app-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/fences
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - NEXTAUTH_URL=http://localhost:3000
    entrypoint: ["/bin/sh", "/opt/entrypoint.dev.sh"]
    volumes:
      - .:/app
      - ./docker/entrypoint.dev.sh:/opt/entrypoint.dev.sh:ro
      - dev_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fences-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: fences-db-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=fences
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - fences-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fences"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fences-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_dev_data:/data
    networks:
      - fences-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_dev_data:
  redis_dev_data:
  dev_node_modules:

networks:
  fences-net:
    driver: bridge
