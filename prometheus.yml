global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fences-production'
    environment: 'production'
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'nodejs'
    static_configs:
      - targets:
          - 'node_exporter:9100'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'nextjs-app'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
    metrics_path: /api/metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres_exporter:9187'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis_exporter:9121'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'nginx'
    static_configs:
      - targets:
          - 'nginx_exporter:9113'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
