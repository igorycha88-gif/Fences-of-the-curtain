services:
  # Prometheus - Time Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: fences-prometheus
    restart: unless-stopped
    # No public ports - only accessible via internal Docker network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - app

  # Grafana - Visualization (accessible via Nginx reverse proxy at /grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: fences-grafana
    restart: unless-stopped
    # No public ports - only accessible via Nginx reverse proxy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - prometheus

  # Node Exporter - System Metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: fences-node-exporter
    restart: unless-stopped
    # No public ports - only accessible via internal Docker network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Exporter - Database Metrics
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fences-postgres-exporter
    restart: unless-stopped
    # No public ports - only accessible via internal Docker network
    environment:
      - DATA_SOURCE_NAME=postgres
      - DATA_SOURCE_URI=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/fences?sslmode=disable
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Exporter - Cache Metrics
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: fences-redis-exporter
    restart: unless-stopped
    # No public ports - only accessible via internal Docker network
    environment:
      - REDIS_ADDR=redis://:${REDIS_PASSWORD:-password}@redis:6379
      - REDIS_EXPORTER_WEB_LISTEN_ADDRESS=0.0.0.0:9121
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Exporter - Proxy Metrics
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: fences-nginx-exporter
    restart: unless-stopped
    # No public ports - only accessible via internal Docker network
    environment:
      - NGINX_STATUS_URI=http://nginx:80
      - NGINX_STATUS_SCHEME=http
      - NGINX_STATUS_HOST=nginx
      - NGINX_STATUS_PORT=80
      - SCRAPE_URI=http://nginx:80
    external_links:
      - nginx
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://nginx:9113/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  prometheus_data:
  grafana_data:
  grafana_dashboards:
